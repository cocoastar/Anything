<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理后台 - 西交校园</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}" />
  <style>
    body { margin: 0; min-height: 100vh; }
    .header { background: var(--card); padding: 16px 24px; box-shadow: var(--shadow); margin-bottom: 0; }
    .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .header a { color: var(--pri); text-decoration: none; font-size: 14px; font-weight: 500; }
    .main { max-width: 560px; margin: 0 auto; padding: 24px; }
    .card { background: var(--card); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); text-decoration: none; color: inherit; display: block; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: var(--shadow-md); }
    .card h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
    .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <header class="header">
    <h1>管理后台</h1>
    <a href="{{ url_for('home_page') }}">返回工作台</a>
  </header>
  <main class="main">
  <a href="{{ url_for('admin_eat') }}" class="card">
    <h3>西交吃什么 · 审核与创建</h3>
    <p>审核用户提交的餐厅/窗口/菜品，或直接创建食堂数据</p>
  </a>
  </main>
</body>
</html>
